<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f6f3;
        color: #1c1b1f;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      }
      main { max-width: 360px; }
      .mono {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: #570080;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, 'Source Serif 4', serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { font-size: 16px; line-height: 1.5; margin: 0 0 28px; color: #49454f; }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: #570080;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #1c1b1f; outline-offset: 3px; }
      button:disabled { opacity: 0.7; }
    </style>
  </head>
  <body>
    <main>
      <div class="mono" aria-hidden="true">GB</div>
      <h1>Sem conexão</h1>
      <p>Não foi possível falar com o Gestor Beauty. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button id="retry" type="button">Tentar novamente</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        this.disabled = true;
        this.textContent = 'Conectando…';
        location.replace('https://sgs.jessicaseixasmakeup.com.br/');
      });
    </script>
  </body>
</html>
