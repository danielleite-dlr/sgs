# ===== Appointments =====

extend type Query {
  "Agendamentos que sobrepõem o intervalo solicitado."
  appointments(
    startsAt: DateTime!
    endsAt: DateTime!
    professionalId: UUID
  ): [Appointment!]!
}

extend type Mutation {
  createAppointment(input: CreateAppointmentInput!): AppointmentPayload!
  "Move (drag-and-drop) preservando a duração; pode trocar de profissional."
  moveAppointment(input: MoveAppointmentInput!): AppointmentPayload!
  updateAppointmentStatus(input: UpdateAppointmentStatusInput!): AppointmentPayload!
  "Todo cancelamento exige motivo; reasonTag 'no_show' grava o status no_show."
  cancelAppointment(input: CancelAppointmentInput!): AppointmentPayload!
}

type Appointment {
  id: UUID!
  professionalId: UUID!
  clientId: UUID!
  serviceId: UUID!
  startsAt: DateTime!
  endsAt: DateTime!
  status: String!
  notes: String
  comandaId: UUID
  serviceVariantId: UUID
  depositAmount: String!
  cancelReason: String
  cancelReasonTag: String
  cancelledAt: DateTime
  professional: Member!
  client: Client!
  service: Service!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateAppointmentInput {
  professionalId: UUID!
  clientId: UUID!
  serviceId: UUID!
  startsAt: DateTime!
  endsAt: DateTime!
  notes: String
}

type AppointmentPayload {
  appointment: Appointment
  errors: [UserError!]!
}

input MoveAppointmentInput {
  id: UUID!
  professionalId: UUID!
  startsAt: DateTime!
}

input UpdateAppointmentStatusInput {
  id: UUID!
  status: String!
}

input CancelAppointmentInput {
  id: UUID!
  reason: String!
  reasonTag: String
}
