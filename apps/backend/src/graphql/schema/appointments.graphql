# ===== Appointments =====

extend type Query {
  "Agendamentos que sobrepõem o intervalo solicitado."
  appointments(
    startsAt: DateTime!
    endsAt: DateTime!
    professionalId: UUID
  ): [Appointment!]!
  "Bloqueios do intervalo; com professionalId inclui os feriados (org-wide)."
  timeBlocks(
    startsAt: DateTime!
    endsAt: DateTime!
    professionalId: UUID
  ): [TimeBlock!]!
}

extend type Mutation {
  createAppointment(input: CreateAppointmentInput!): AppointmentPayload!
  "Visita: vários serviços/raias (pacote opcional) + comanda aberta + sinal opcional, atômico."
  createVisit(input: CreateVisitInput!): VisitPayload!
  "Move (drag-and-drop) preservando a duração; pode trocar de profissional."
  moveAppointment(input: MoveAppointmentInput!): AppointmentPayload!
  updateAppointmentStatus(input: UpdateAppointmentStatusInput!): AppointmentPayload!
  "Todo cancelamento exige motivo; reasonTag 'no_show' grava o status no_show."
  cancelAppointment(input: CancelAppointmentInput!): AppointmentPayload!
  createTimeBlock(input: CreateTimeBlockInput!): TimeBlockPayload!
  deleteTimeBlock(id: UUID!): TimeBlockPayload!
}

type Appointment {
  id: UUID!
  professionalId: UUID!
  clientId: UUID!
  serviceId: UUID!
  startsAt: DateTime!
  endsAt: DateTime!
  status: String!
  notes: String
  comandaId: UUID
  serviceVariantId: UUID
  depositAmount: String!
  comandaCode: String
  comandaStatus: String
  cancelReason: String
  cancelReasonTag: String
  cancelledAt: DateTime
  professional: Member!
  client: Client!
  service: Service!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateAppointmentInput {
  professionalId: UUID!
  clientId: UUID!
  serviceId: UUID!
  startsAt: DateTime!
  endsAt: DateTime!
  notes: String
}

type AppointmentPayload {
  appointment: Appointment
  errors: [UserError!]!
}

input MoveAppointmentInput {
  id: UUID!
  professionalId: UUID!
  startsAt: DateTime!
}

input UpdateAppointmentStatusInput {
  id: UUID!
  status: String!
}

input CancelAppointmentInput {
  id: UUID!
  reason: String!
  reasonTag: String
}

"kind: folga | intervalo | feriado | indisponibilidade | deslocamento (gerado pelo grupo de noivas). professionalId nulo = feriado (org-wide)."
type TimeBlock {
  id: UUID!
  kind: String!
  professionalId: UUID
  startsAt: DateTime!
  endsAt: DateTime!
  allDay: Boolean!
  note: String
  bridalGroupId: UUID
  createdAt: DateTime!
}

input CreateTimeBlockInput {
  kind: String!
  professionalId: UUID
  startsAt: DateTime!
  endsAt: DateTime!
  allDay: Boolean
  note: String
}

type TimeBlockPayload {
  timeBlock: TimeBlock
  errors: [UserError!]!
}

input VisitItemInput {
  serviceId: UUID!
  serviceVariantId: UUID
  professionalId: UUID!
  startsAt: DateTime!
  endsAt: DateTime!
}

input DepositInput { amount: String! method: String! }

input CreateVisitInput {
  clientId: UUID!
  items: [VisitItemInput!]!
  packageId: UUID
  deposit: DepositInput
  notes: String
}

type VisitPayload {
  appointments: [Appointment!]!
  comandaId: UUID
  errors: [UserError!]!
}
