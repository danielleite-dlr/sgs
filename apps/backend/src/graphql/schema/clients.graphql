# ===== Clients =====

extend type Query {
  clients(search: String, limit: Int, offset: Int): ClientConnection!
  client(id: UUID!): Client
  clientsByField(cpf: String, phone: String, email: String, excludeId: UUID): [Client!]!
  clientHistory(clientId: UUID!, filters: ClientHistoryFilters): [ClientHistoryItem!]!
  clientOverview(clientId: UUID!): ClientOverview!
}

extend type Mutation {
  createClient(input: CreateClientInput!): ClientPayload!
  updateClient(input: UpdateClientInput!): ClientPayload!
  softDeleteClient(input: SoftDeleteInput!): ClientPayload!
  restoreClient(input: SoftDeleteInput!): ClientPayload!
}

type Client {
  id: UUID!
  fullName: String!
  phone: String
  email: String
  cpf: String
  birthDate: DateTime
  address: String
  rg: String
  postalCode: String
  phone2: String
  phone3: String
  notes: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ClientConnection {
  rows: [Client!]!
  totalCount: Int!
}

input ClientHistoryFilters {
  fromDate: DateTime
  toDate: DateTime
  professionalId: UUID
  kind: ClientHistoryKind
}

enum ClientHistoryKind { all appointment product comanda }

"kind: appointment | comanda | product | contract_payment; entityType: appointment | comanda | contract."
type ClientHistoryItem {
  id: UUID!
  occurredAt: DateTime!
  kind: String!
  description: String!
  amount: String
  professionalName: String
  entityType: String
  entityId: UUID
}

"Situação da cliente no estabelecimento (grupos de noiva, contratos, próximos atendimentos, números)."
type ClientOverview {
  bridalGroups: [ClientOverviewGroup!]!
  contracts: [ClientOverviewContract!]!
  upcomingAppointments: [ClientOverviewAppointment!]!
  stats: ClientOverviewStats!
}

"role: bride | debutante | companion | responsible; eventDate: YYYY-MM-DD."
type ClientOverviewGroup {
  id: UUID!
  name: String!
  eventKind: String!
  role: String!
  eventDate: String!
  eventTime: String
  status: String!
  trialDates: [DateTime!]!
}

type ClientOverviewContract {
  id: UUID!
  code: String!
  status: String!
  groupId: UUID!
  groupName: String!
  totalAmount: String!
  paid: String!
  balance: String!
  nextDueDate: String
  nextDueAmount: String
}

"kind: trial | event | normal."
type ClientOverviewAppointment {
  id: UUID!
  startsAt: DateTime!
  endsAt: DateTime!
  status: String!
  serviceName: String!
  professionalName: String!
  kind: String!
  comandaId: UUID
  bridalGroupId: UUID
}

type ClientOverviewStats {
  completedCount: Int!
  lastVisitAt: DateTime
  totalSpent: String!
  creditBalance: String!
}

input CreateClientInput {
  fullName: String!
  phone: String
  email: String
  cpf: String
  birthDate: DateTime
  address: String
  rg: String
  postalCode: String
  phone2: String
  phone3: String
  notes: String
}

input UpdateClientInput {
  id: UUID!
  fullName: String
  phone: String
  email: String
  cpf: String
  birthDate: DateTime
  address: String
  rg: String
  postalCode: String
  phone2: String
  phone3: String
  notes: String
}

type ClientPayload {
  client: Client
  errors: [UserError!]!
}
