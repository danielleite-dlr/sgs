# ─── SGS — staging vhost ──────────────────────────────────────────────────────
# sgs.jessicaseixasmakeup.com.br  →  85.209.93.171 (esta VPS)
#
# Roteamento:
#   /graphql   →  backend NestJS   (127.0.0.1:3010)
#   /health    →  backend NestJS   (healthcheck)
#   /          →  frontend build   (127.0.0.1:8090, nginx do container)
#
# Front e back respondem na MESMA origem de propósito: o Apollo usa o fallback
# same-origin '/graphql', então não há URL de API embutida no build nem CORS.
#
# Instalação:
#   ln -s /root/sgs/infra/nginx/sgs-staging.conf /etc/nginx/sites-enabled/sgs-staging
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d sgs.jessicaseixasmakeup.com.br   # injeta o bloco 443
# ──────────────────────────────────────────────────────────────────────────────

server {
    server_name sgs.jessicaseixasmakeup.com.br;

    access_log /var/log/nginx/sgs-staging.access.log;
    error_log  /var/log/nginx/sgs-staging.error.log;

    # Ambiente de validação: não deve ser indexado nem varrido.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Uploads (fotos de serviço, avatares) — o default de 1M é apertado.
    client_max_body_size 25m;

    # ─── Basic auth ───────────────────────────────────────────────────────────
    # Desligado a pedido: o staging abre direto na URL, sem prompt de senha.
    # Para voltar a proteger, descomente o par abaixo (o arquivo .htpasswd-sgs
    # continua em /etc/nginx/) e recarregue o nginx.
    # auth_basic           "SGS — ambiente de validacao";
    # auth_basic_user_file /etc/nginx/.htpasswd-sgs;

    # ─── Backend ──────────────────────────────────────────────────────────────
    location /graphql {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket: subscriptions GraphQL
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Healthcheck para monitoramento externo.
    location = /health {
        proxy_pass http://127.0.0.1:3010/health;
        proxy_set_header Host $host;
    }

    # ─── Frontend (SPA) ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sgs.jessicaseixasmakeup.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sgs.jessicaseixasmakeup.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = sgs.jessicaseixasmakeup.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sgs.jessicaseixasmakeup.com.br;
    return 404; # managed by Certbot


}