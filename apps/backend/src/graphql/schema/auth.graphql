extend type Query {
  me: AuthSession
}

extend type Mutation {
  verifyEmail(input: VerifyEmailInput!): VerifyEmailPayload!
  resendVerification(input: ResendVerificationInput!): ResendVerificationPayload!
  login(input: LoginInput!): AuthPayload!
  refreshSession(input: RefreshInput!): AuthPayload!
  logout(input: RefreshInput!): LogoutPayload!
  "Troca a própria senha. Encerra a obrigação de trocar no primeiro acesso."
  changePassword(input: ChangePasswordInput!): ChangePasswordPayload!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

type ChangePasswordPayload {
  success: Boolean!
  errors: [UserError!]!
}

input VerifyEmailInput {
  token: String!
}

input ResendVerificationInput {
  email: Email!
}

input LoginInput {
  email: Email!
  password: String!
}

input RefreshInput {
  refreshToken: String!
}

type AuthSession {
  userId: UUID!
  email: Email!
  fullName: String!
  "Papel de plataforma: cadastra e acompanha os clientes."
  isPlatformAdmin: Boolean!
  "Master: concede e revoga acesso dos outros admins."
  isPlatformMaster: Boolean!
  "Pode entrar no salão de um cliente."
  canAccessClientOrgs: Boolean!
  "Senha temporária: precisa trocar antes de usar o sistema."
  mustChangePassword: Boolean!
  "Sessão aberta pelo seletor, dentro da organização de um cliente."
  impersonating: Boolean!
  memberships: [Membership!]!
}

type Membership {
  memberId: UUID!
  organizationId: UUID!
  organizationName: String!
  roleName: String!
  "active ou suspended."
  organizationStatus: String!
}

type AuthPayload {
  accessToken: String
  refreshToken: String
  session: AuthSession
  errors: [UserError!]!
}

type VerifyEmailPayload {
  success: Boolean!
  errors: [UserError!]!
}

type ResendVerificationPayload {
  success: Boolean!
  cooldownSeconds: Int
  errors: [UserError!]!
}

type LogoutPayload {
  success: Boolean!
}

type UserError {
  code: String!
  message: String!
  field: String
}
