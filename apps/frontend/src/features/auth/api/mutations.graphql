mutation Signup($input: SignupInput!) {
  signup(input: $input) {
    accessToken
    refreshToken
    session {
      userId
      email
      fullName
      memberships {
        memberId
        organizationId
        organizationName
        roleName
      }
    }
    errors {
      code
      message
      field
    }
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    accessToken
    refreshToken
    session {
      userId
      email
      fullName
      memberships {
        memberId
        organizationId
        organizationName
        roleName
      }
    }
    errors {
      code
      message
      field
    }
  }
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input) {
    success
    errors {
      code
      message
    }
  }
}

mutation ResendVerification($input: ResendVerificationInput!) {
  resendVerification(input: $input) {
    success
    cooldownSeconds
    errors {
      code
      message
    }
  }
}

