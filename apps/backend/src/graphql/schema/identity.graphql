extend type Query {
  members: [Member!]!
  allMembers: [Member!]!
  pendingInvitations: [PendingInvitation!]!
}

extend type Mutation {
  inviteMember(input: InviteMemberInput!): InviteMemberPayload!
  acceptInvitation(input: AcceptInvitationInput!): AuthPayload!
  revokeInvitation(invitationId: UUID!): RevokeInvitationPayload!
  updateMember(input: UpdateMemberInput!): UpdateMemberPayload!
  deactivateMember(id: UUID!): DeactivateMemberPayload!
  reactivateMember(id: UUID!): ReactivateMemberPayload!
  createMember(input: CreateMemberInput!): CreateMemberPayload!
  resetMemberPassword(input: ResetMemberPasswordInput!): ResetMemberPasswordPayload!
}

# ===== Members (added Phase 2 — needed by commissions.graphql cross-SDL reference) =====

enum MemberStatus { active inactive }

type Member {
  id: UUID!
  displayName: String!
  email: String!
  roleName: String!
  seniorityTier: SeniorityTier
  isProfessional: Boolean!
  status: MemberStatus!
  "Dados pessoais: só ADMIN/MANAGER recebem valores (LGPD); os demais recebem null."
  phone: String
  pixKey: String
  birthDate: DateTime
  "Categorias atendidas. Vazio = atende todas."
  categories: [MemberCategory!]!
  createdAt: DateTime!
}

type MemberCategory {
  id: UUID!
  name: String!
}

input CreateMemberInput {
  displayName: String!
  email: Email!
  phone: String!
  pixKey: String!
  birthDate: DateTime
  roleName: String!
  isProfessional: Boolean
  categoryIds: [UUID!]
  temporaryPassword: String!
}

"A senha provisória NÃO volta aqui: o frontend já a tem e a exibe uma única vez."
type CreateMemberPayload {
  member: Member
  "true quando o e-mail já tinha conta: só o member foi criado, a senha não foi tocada."
  existingAccount: Boolean!
  warning: String
  errors: [UserError!]!
}

input ResetMemberPasswordInput {
  id: UUID!
}

type ResetMemberPasswordPayload {
  member: Member
  temporaryPassword: String
  errors: [UserError!]!
}

# SeniorityTier enum is defined in catalog.graphql (shared with ServicePricingVariant)

input InviteMemberInput {
  email: Email!
  roleName: String!
  isProfessional: Boolean
  seniorityTier: SeniorityTier
}

input AcceptInvitationInput {
  token: String!
  fullName: String!
  password: String!
}

input UpdateMemberInput {
  id: UUID!
  roleName: String
  isProfessional: Boolean
  seniorityTier: SeniorityTier
  phone: String
  pixKey: String
  birthDate: DateTime
  categoryIds: [UUID!]
}

type UpdateMemberPayload {
  member: Member
  errors: [UserError!]!
}

"Agendamento futuro que impede a desativação. Usado para a mensagem acionável."
type BlockingAppointment {
  id: UUID!
  startsAt: DateTime!
  clientName: String!
  serviceName: String!
}

type DeactivateMemberPayload {
  member: Member
  "Total de agendamentos futuros. > 0 junto com errors significa bloqueio."
  futureAppointmentCount: Int!
  "Os 5 mais próximos, para a UI identificar o que remanejar."
  blockingAppointments: [BlockingAppointment!]!
  "Informativo: regras de comissão vinculadas NÃO bloqueiam (ver MembersService.deactivate)."
  activeCommissionRuleCount: Int!
  errors: [UserError!]!
}

type ReactivateMemberPayload {
  member: Member
  errors: [UserError!]!
}

type InviteMemberPayload {
  invitationId: UUID
  expiresAt: DateTime
  errors: [UserError!]!
}

type RevokeInvitationPayload {
  success: Boolean!
  errors: [UserError!]!
}

type PendingInvitation {
  id: UUID!
  email: Email!
  roleName: String!
  isProfessional: Boolean!
  seniorityTier: SeniorityTier
  expiresAt: DateTime!
  createdAt: DateTime!
}
