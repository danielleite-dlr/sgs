"Token de push do aparelho (FCM) ou inscrição Web Push (iPhone)."
input RegisterDeviceTokenInput {
  "FCM: token; webpush: endpoint da inscrição"
  token: String!
  "android | ios"
  platform: String!
  "fcm (padrão) | expo (reservado) | webpush"
  provider: String
  appVersion: String
  "Web Push: chave p256dh da inscrição (base64url)"
  p256dh: String
  "Web Push: chave auth da inscrição (base64url)"
  auth: String
}

extend type Mutation {
  "Registra (ou move para a usuária atual) o token do aparelho. Sessão de admin de plataforma dentro do salão não registra e devolve false."
  registerDeviceToken(input: RegisterDeviceTokenInput!): Boolean!
  "Remove o token do aparelho da usuária atual (logout)."
  unregisterDeviceToken(token: String!): Boolean!
}
